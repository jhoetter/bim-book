# Terms Registry
# Tracks which chapter first fully introduces each glossary term (full name + abbreviation).
# Agents MUST read this before writing a chapter, and update it after.
#
# CHAPTER ORDER (sequential — do not change):
#   01-architektur-als-system
#   02-entwurf-raum-funktion
#   03-baustoffe
#   04-tragwerk
#   05-konstruktion
#   06-waermeschutz-geg
#   07-feuchteschutz
#   08-schallschutz
#   09-brandschutz
#   10-heizung-waermeversorgung
#   11-lueftung
#   12-sanitaer
#   13-elektro
#   14-planungsrecht
#   15-hoai
#   16-kosten-ausschreibung
#   17-was-bim-wirklich-ist
#   18-ifc
#   19-klassifikation
#   20-prozess-kollaboration
#   21-bim-praxis
#   22-nachhaltigkeit
#   23-sanierung
#   24-digitaler-zwilling-ki
#
# FIELD MEANINGS:
#   introduced_in: chapter ID where the term was first spelled out in full
#   null means: not yet introduced in any finalized chapter
#
# USAGE RULES FOR WRITING AGENTS:
#   - If introduced_in is set AND that chapter comes BEFORE your current chapter →
#     use ::ABBREV:: (or ::TermName::) freely without re-introduction.
#   - If introduced_in is null OR that chapter is your current chapter or later →
#     write the FULL NAME in bold on first use, with abbreviation in parentheses:
#       **Technische Gebäudeausrüstung** (::TGA::)
#     Then update this registry.
#   - Do NOT introduce a term before the chapter where it is first needed.
#     The planned introduction chapters are listed in the Writing Guide.

